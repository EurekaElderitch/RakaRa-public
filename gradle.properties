# ---------- JVM: hemat memori untuk mesin 4 GB ----------
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8

# Kotlin compiler jalan DI DALAM Gradle heap (tidak spawn daemon terpisah)
# Ini hemat ~700 MB RAM, tapi compile lebih lambat. Cocok untuk 4 GB.
kotlin.compiler.execution.strategy=in-process

# Tidak parallel — 1 task jalan sekaligus, hemat memori
org.gradle.parallel=false
org.gradle.workers.max=1

# Daemon tetap aktif supaya build kedua+ lebih cepat, tapi tidak agresif
org.gradle.daemon=true

# Build cache: hasil compile di-reuse antar-build (WAJIB untuk hemat waktu)
org.gradle.caching=true
kotlin.incremental=true

# ---------- Android ----------
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=34

# ---------- Kotlin ----------
kotlin.code.style=official